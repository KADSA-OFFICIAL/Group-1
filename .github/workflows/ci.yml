name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3-stable

jobs:
  scene-integrity:
    name: 씬 정합성 정적 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify_scenes.py 실행
        run: python3 tools/verify_scenes.py

  godot-check:
    name: Godot 헤드리스 임포트·씬 로드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot 다운로드
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${ZIP}"
          curl -fsSL -o /tmp/godot.zip "$URL"
          unzip -q -o /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: 버전 확인
        run: ~/godot-bin/godot --headless --version

      - name: 프로젝트 임포트 (스크립트 파싱 포함)
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --import 2>&1 | tee /tmp/import.log

      - name: 임포트 로그의 스크립트 오류 검사
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|error at line" /tmp/import.log; then
            echo "::error::임포트 중 스크립트 오류가 발견됐다"
            exit 1
          fi
          echo "스크립트 오류 없음"

      - name: 전체 씬 로드·인스턴스화
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --script res://tools/ci_load_scenes.gd 2>&1 | tee /tmp/load.log

      - name: 로드 로그의 씬·스크립트 오류 검사
        run: |
          # 스크립트 패턴(SCRIPT ERROR 등)은 임포트 로그에서만 보던 것을 여기에도 건다.
          # 씬은 스크립트가 컴파일에 실패해도 그 스크립트만 빠진 채 로드에 성공하므로,
          # 로더의 종료 코드만으로는 컴파일 오류를 놓친다 (#183).
          if grep -nE "LOAD FAILED|INSTANTIATE FAILED|NOT A PackedScene|Failed loading resource|Cannot get node|AUTOLOAD MISSING|SCRIPT LOAD FAILED|SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|error at line" /tmp/load.log; then
            echo "::error::씬 로드 중 씬 또는 스크립트 오류가 발견됐다"
            exit 1
          fi
          echo "씬·스크립트 오류 없음"

      # 여기까지는 씬을 instantiate만 한다 — 트리에 안 넣으므로 _ready가 돌지
      # 않고 @onready 경로·시그널·트윈이 통째로 미검증이다(#240). 아래 잡이
      # 실제로 트리에 붙이고 프레임을 돌린다.
      - name: 런타임 스모크 (트리에 붙이고 프레임 돌리기)
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --script res://tools/ci_smoke_scenes.gd 2>&1 | tee /tmp/smoke.log

      - name: 스모크 로그의 오류 검사
        run: |
          # 스크립트는 실패를 종료 코드로도 내지만, push_error가 찍은 줄을
          # 한 번 더 본다 — 검사 밖에서 난 런타임 오류도 잡으려는 것이다.
          if grep -nE "SCRIPT ERROR|Parse Error|Cannot get node|Invalid call|스모크: " /tmp/smoke.log; then
            echo "::error::런타임 스모크에서 오류가 발견됐다"
            exit 1
          fi
          echo "런타임 오류 없음"
