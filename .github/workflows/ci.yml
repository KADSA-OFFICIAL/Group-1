name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3-stable

jobs:
  scene-integrity:
    name: 씬 정합성 정적 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify_scenes.py 실행
        run: python3 tools/verify_scenes.py

  godot-check:
    name: Godot 헤드리스 임포트·씬 로드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot 다운로드
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          ZIP="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${ZIP}"
          curl -fsSL -o /tmp/godot.zip "$URL"
          unzip -q -o /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: 버전 확인
        run: ~/godot-bin/godot --headless --version

      - name: 프로젝트 임포트 (스크립트 파싱 포함)
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --import 2>&1 | tee /tmp/import.log

      - name: 임포트 로그의 스크립트 오류 검사
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|error at line" /tmp/import.log; then
            echo "::error::임포트 중 스크립트 오류가 발견됐다"
            exit 1
          fi
          echo "스크립트 오류 없음"

      - name: 전체 씬 로드·인스턴스화
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --script res://tools/ci_load_scenes.gd 2>&1 | tee /tmp/load.log

      - name: 로드 로그의 씬 오류 검사
        run: |
          if grep -nE "LOAD FAILED|INSTANTIATE FAILED|NOT A PackedScene|Failed loading resource|Cannot get node" /tmp/load.log; then
            echo "::error::씬 로드 오류가 발견됐다"
            exit 1
          fi
          echo "씬 로드 오류 없음"
